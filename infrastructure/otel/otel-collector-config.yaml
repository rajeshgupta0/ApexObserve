receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  kafka/metrics:
    protocol_version: 2.0.0
    brokers:
      - kafka:29092
    topic: telemetry.metrics
    encoding: otlp_json

  kafka/logs:
    protocol_version: 2.0.0
    brokers:
      - kafka:29092
    topic: telemetry.logs
    encoding: otlp_json

  kafka/traces:
    protocol_version: 2.0.0
    brokers:
      - kafka:29092
    topic: telemetry.traces
    encoding: otlp_json

  logging:
    verbosity: detailed

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s

extensions:
  health_check:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [kafka/traces, logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [kafka/metrics, logging]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [kafka/logs, logging]
