version: '3.8'

services:
  # -----------------------------------------------------------
  # PostgreSQL + TimescaleDB
  # -----------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: apexobserve_timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-apexobserve}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Redis
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: apexobserve_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Kafka (KRaft Mode)
  # -----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: apexobserve_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENERS: 'CONTROLLER://kafka:29093,PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-cluster", "cluster-id", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # OpenTelemetry Collector
  # -----------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: apexobserve_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exposed by the collector
      - "13133:13133" # health_check extension
      - "55679:55679" # zpages extension
    depends_on:
      kafka:
        condition: service_healthy

  # -----------------------------------------------------------
  # Backend Core Services
  # -----------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    container_name: apexobserve_api_gateway
    ports:
      - "8080:8080"

  ingestion-service:
    build:
      context: .
      dockerfile: backend/ingestion-service/Dockerfile
    container_name: apexobserve_ingestion_service
    ports:
      - "8081:8081"

  processing-service:
    build:
      context: .
      dockerfile: backend/processing-service/Dockerfile
    container_name: apexobserve_processing_service
    ports:
      - "8082:8082"

  query-service:
    build:
      context: .
      dockerfile: backend/query-service/Dockerfile
    container_name: apexobserve_query_service
    ports:
      - "8083:8083"

  alerting-service:
    build:
      context: .
      dockerfile: backend/alerting-service/Dockerfile
    container_name: apexobserve_alerting_service
    ports:
      - "8084:8084"

  ai-service:
    build:
      context: ai-service
      dockerfile: Dockerfile
    container_name: apexobserve_ai_service
    ports:
      - "8005:8005"

  # -----------------------------------------------------------
  # Demo Applications
  # -----------------------------------------------------------
  api-gateway-demo:
    build:
      context: .
      dockerfile: demo-services/api-gateway-demo/Dockerfile
    container_name: apexobserve_api_gateway_demo
    ports:
      - "8090:8090"

  inventory:
    build:
      context: .
      dockerfile: demo-services/inventory/Dockerfile
    container_name: apexobserve_demo_inventory
    ports:
      - "8091:8091"

  notification:
    build:
      context: .
      dockerfile: demo-services/notification/Dockerfile
    container_name: apexobserve_demo_notification
    ports:
      - "8092:8092"

  order:
    build:
      context: .
      dockerfile: demo-services/order/Dockerfile
    container_name: apexobserve_demo_order
    ports:
      - "8093:8093"

  payment:
    build:
      context: .
      dockerfile: demo-services/payment/Dockerfile
    container_name: apexobserve_demo_payment
    ports:
      - "8094:8094"

  user:
    build:
      context: .
      dockerfile: demo-services/user/Dockerfile
    container_name: apexobserve_demo_user
    ports:
      - "8095:8095"

volumes:
  timescaledb_data:
  redis_data:
  kafka_data:
